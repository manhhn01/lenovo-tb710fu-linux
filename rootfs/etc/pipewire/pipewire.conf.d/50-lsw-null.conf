# Linux mode on the tablet: no sound card is exposed to the container yet. A null sink gives
# apps an output (PortAudio/Pulse clients such as Xournal++ abort without a server).
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "lsw-null"
      node.description = "No audio device (Linux mode)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
    }
  }
]
