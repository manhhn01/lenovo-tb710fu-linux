<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Noto Color Emoji also contains the space character, with a very wide advance. When an app
     (Lark) puts the emoji font in its font list, every space between words becomes huge. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset><range><int>0x0000</int><int>0x00FF</int></range></charset>
      </minus>
    </edit>
  </match>
</fontconfig>
